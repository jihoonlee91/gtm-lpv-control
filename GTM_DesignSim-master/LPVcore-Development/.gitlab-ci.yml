stages:
  - lint
  - test
  - examples

.docker_run: &docker_run
  - echo "$DREBBLE_REGISTRY_TOKEN" | docker login registry.gitlab.com
      --username $DREBBLE_REGISTRY_USERNAME --password-stdin
  - docker run --net=host -v $(pwd):/home/matlab/lpvcore --workdir /home/matlab/lpvcore
      registry.gitlab.com/drebble/docker-matlab:$MATLAB -batch $BATCH

.common:
  tags:
    - matlab
  script:
    - *docker_run

lint-R2022a:
  extends: .common
  variables:
    MATLAB: "r2022a"
    BATCH: "lint"
  stage: lint

lint-R2021b:
  extends: .common
  variables:
    MATLAB: "r2021b"
    BATCH: "lint"
  stage: lint

lint-R2021a:
  extends: .common
  variables:
    MATLAB: "r2021a"
    BATCH: "lint"
  stage: lint

test-R2022a:
  extends: .common
  variables:
    MATLAB: "r2022a"
    BATCH: "test"
  stage: test

test-R2021b:
  extends: .common
  variables:
    MATLAB: "r2021b"
    BATCH: "test"
  stage: test

test-R2021a:
  extends: .common
  variables:
    MATLAB: "r2021a"
    BATCH: "test"
  stage: test

